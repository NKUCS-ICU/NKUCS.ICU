  <!-- Back to top button style -->
  <style>
    #back-to-top {
      display: none;
      position: fixed;
      bottom: 52px;
      right: 25px;
      z-index: 999;
      width: 40px;
      height: 40px;
      background: #42b983;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 20px;

    }
    .utterances {
      max-width: 100%;

    }

    }
  </style>
</head>
<body>
  <div id="app"></div>
  <noscript>本站需要启用 JavaScript 才能加载课程内容。</noscript>
  <!-- Back to top button -->
  <button id="back-to-top" title="回到顶部" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>
  <script>
    window.$docsify = {
      name: 'NKUCS.ICU',
      repo: 'NKUCS-ICU/NKUCS.ICU',
      loadSidebar: true,
      alias: {
                '/.*/_sidebar.md': '/_sidebar.md',
      },
      footer: {
        copy: '<span id="busuanzi_container_site_pv">👀 本站总访问量：<span id="busuanzi_value_site_pv"></span> 次</span> <span id="busuanzi_container_site_uv">| 🚴‍♂️ 本站总访客数：<span id="busuanzi_value_site_uv"></span> 人</span><br/><span id="sitetime"></span> <br/> <span>Copyright &copy; 2022 &nbsp; Maintainer:</span>',
        auth: ' <strong><a href="https://github.com/emanual20" target="_blank">@Emanual20</a> <a href="https://github.com/VitalC-3026/" target="_blank">@VitalC-3026</a> <a href="https://github.com/Rainefly" target="_blank">@Rainefly</a> <a href="https://github.com/aokimi0" target="_blank">@aokimi0</a> </strong>',
        pre: '<hr/>',
        style: 'font-size: 18px; text-align: center;',
      },
      subMaxLevel: 5,
      sidebarDisplayLevel: 1,
      search: {
        maxAge: 3600000,
        paths: 'auto',
        placeholder: {
          '/zh-cn/': '搜索',
          '/': 'Type to search'
        },
        noData: {
          '/zh-cn/': '找不到结果',
          '/': 'No Results'
        },
        depth: 6,
        hideOtherSidebarContent: true,
        namespace: 'nkucs.icu',
      },
      count:{
        countable: true,
        fontsize: '0.9em',
        color: 'rgb(90,90,90)',
        language: 'chinese'
      },
      plugins: [
        // Render comments without exposing an OAuth client secret in the browser.
        function(hook, vm) {
          hook.doneEach(function() {
            var article = document.querySelector('.markdown-section');
            if (!article) return;

            var oldComments = document.getElementById('comments');
            if (oldComments) oldComments.remove();

            var comments = document.createElement('div');
            comments.id = 'comments';
            article.appendChild(comments);

            var fallback = document.createElement('p');
            fallback.className = 'comments-fallback';
            var fallbackLink = document.createElement('a');
            fallbackLink.href = 'https://github.com/NKUCS-ICU/NKUCS.ICU/issues';
            fallbackLink.target = '_blank';
            fallbackLink.rel = 'noopener noreferrer';
            fallbackLink.textContent = '评论未加载？前往 GitHub Issues 参与讨论';
            fallback.appendChild(fallbackLink);
            comments.appendChild(fallback);

            var utterances = document.createElement('script');
            utterances.src = 'https://utteranc.es/client.js';
            utterances.async = true;
            utterances.crossOrigin = 'anonymous';
            utterances.setAttribute('repo', 'NKUCS-ICU/NKUCS.ICU');
            utterances.setAttribute('issue-term', 'title');
            utterances.setAttribute('theme', 'github-light');
            comments.appendChild(utterances);
          });
        }
      ],
    }
  </script>

        btn.style.display = (window.scrollY || document.documentElement.scrollTop) > 100 ? 'block' : 'none';

  <!-- Site running time (fixed: JS months are 0-indexed, Dec=11) -->
  <script>
    function siteTime() {
      var seconds = 1000;
      var minutes = seconds * 60;
      var hours = minutes * 60;
      var days = hours * 24;
      var years = days * 365;
      var today = new Date();
      var todayYear = today.getFullYear();
      var todayMonth = today.getMonth();
      var todayDate = today.getDate();
      var todayHour = today.getHours();
      var todayMinute = today.getMinutes();
      var todaySecond = today.getSeconds();
      var t1 = Date.UTC(2021, 11, 02, 00, 00, 00);
      var t2 = Date.UTC(todayYear, todayMonth, todayDate, todayHour, todayMinute, todaySecond);
      var diff = t2 - t1;
      var diffYears = Math.floor(diff / years);
      var diffDays = Math.floor((diff / days) - diffYears * 365);
      var diffHours = Math.floor((diff - (diffYears * 365 + diffDays) * days) / hours);
      var diffMinutes = Math.floor((diff - (diffYears * 365 + diffDays) * days - diffHours * hours) / minutes);
      var diffSeconds = Math.floor((diff - (diffYears * 365 + diffDays) * days - diffHours * hours - diffMinutes * minutes) / seconds);
      var siteTimeElement = document.getElementById("sitetime");
      if (siteTimeElement) {
        siteTimeElement.textContent = " 本站已安全运行 " + diffYears + " 年 " + diffDays + " 天 " + diffHours + " 小时 " + diffMinutes + " 分 " + diffSeconds + " 秒 ";
      }
      window.setTimeout(siteTime, 1000);
    }
    siteTime();
  </script>
